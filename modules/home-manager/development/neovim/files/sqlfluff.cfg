# User-wide sqlfluff defaults; a project's own .sqlfluff overrides any key
# (e.g. `dialect = postgres`).
[sqlfluff]
dialect = sqlite
max_line_length = 100

# Line up column types and constraints in CREATE TABLE.
[sqlfluff:layout:type:data_type]
spacing_before = align
align_within = create_table_statement

[sqlfluff:layout:type:column_constraint_segment]
spacing_before = align
align_within = create_table_statement

[sqlfluff:rules:capitalisation.keywords]
capitalisation_policy = upper

[sqlfluff:rules:capitalisation.types]
extended_capitalisation_policy = upper
